<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gothic Crimson & Gold - 哥德暗黑狼人殺視訊平台</title>
  <style>
    :root {
      --bg-color: #0b080d;
      --panel-bg: rgba(22, 16, 28, 0.95);
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --crimson-red: #8b0000;
      --crimson-bright: #e60000;
      --text-color: #e8e6e3;
      --border-gold: 1px solid rgba(212, 175, 55, 0.4);
      --shadow-gothic: 0 8px 32px rgba(0, 0, 0, 0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cinzel', 'Noto Serif TC', serif; }

    body {
      background: #000 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%230b080d"/><path d="M0 0l100 100M100 0L0 100" stroke="%231a1220" stroke-width="0.5"/></svg>');
      color: var(--text-color);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(11, 8, 13, 0.95);
      border-bottom: 2px solid var(--gold-primary);
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
      z-index: 100;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--gold-primary);
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-gothic {
      background: linear-gradient(135deg, #1f1427, #0f0a14);
      color: var(--gold-light);
      border: var(--border-gold);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-gothic:hover {
      background: linear-gradient(135deg, #321f40, #1a1024);
      border-color: var(--gold-primary);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
      color: #fff;
    }

    .btn-crimson {
      background: linear-gradient(135deg, var(--crimson-red), #4a0000);
      border-color: var(--crimson-bright);
      color: #fff;
    }

    .btn-crimson:hover {
      background: linear-gradient(135deg, var(--crimson-bright), #660000);
      box-shadow: 0 0 15px rgba(230, 0, 0, 0.6);
    }

    .system-banner-box {
      background: linear-gradient(90deg, rgba(20,10,30,0.95), rgba(139,0,0,0.5), rgba(20,10,30,0.95));
      border-bottom: 1px solid var(--gold-primary);
      padding: 8px 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .banner-line-1 { font-size: 0.85rem; color: var(--gold-primary); font-weight: bold; letter-spacing: 1px; }
    .banner-line-2 { font-size: 1.05rem; color: #fff; margin: 2px 0; text-shadow: 0 0 8px rgba(255,255,255,0.4); }
    .banner-line-3 { font-size: 0.8rem; color: var(--gold-light); }

    .screen-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 5, 10, 0.96);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .lobby-card {
      background: var(--panel-bg);
      border: 2px solid var(--gold-primary);
      border-radius: 8px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow-gothic);
      text-align: center;
    }

    .lobby-title { font-size: 1.8rem; color: var(--gold-primary); margin-bottom: 10px; }
    .lobby-subtitle { font-size: 0.9rem; color: #aaa; margin-bottom: 25px; }

    .input-gothic {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: var(--border-gold);
      color: #fff;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 1rem;
    }

    .main-layout {
      display: flex;
      flex: 1;
      padding: 15px;
      gap: 15px;
      position: relative;
    }

    .table-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .seat-card {
      background: var(--panel-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: all 0.3s ease;
    }

    .seat-card.highlight {
      border-color: var(--gold-primary);
      box-shadow: 0 0 15px var(--gold-primary);
    }

    .seat-card.active-speaker {
      border-color: var(--crimson-bright);
      box-shadow: 0 0 20px var(--crimson-bright);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 10px var(--crimson-bright); }
      50% { box-shadow: 0 0 25px var(--crimson-bright); }
      100% { box-shadow: 0 0 10px var(--crimson-bright); }
    }

    .seat-card.dead { opacity: 0.4; filter: grayscale(1); }

    .badge-sheriff {
      position: absolute;
      top: -8px;
      left: -8px;
      background: var(--gold-primary);
      color: #000;
      font-weight: bold;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.75rem;
      box-shadow: 0 0 8px var(--gold-primary);
      z-index: 10;
    }

    .avatar-video-container {
      width: 100%;
      height: 95px;
      background: #000;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 6px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .avatar-video { width: 100%; height: 100%; object-fit: cover; }
    .avatar-placeholder { font-size: 0.75rem; color: #666; }

    .seat-info {
      font-size: 0.8rem;
      color: var(--gold-light);
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .floating-panel {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 340px;
      max-width: calc(100vw - 40px);
      background: var(--panel-bg);
      border: 2px solid var(--gold-primary);
      border-radius: 8px;
      box-shadow: var(--shadow-gothic);
      z-index: 500;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .floating-panel.collapsed { transform: translateY(calc(100% - 45px)); }

    .panel-header {
      background: linear-gradient(90deg, #1f1427, #0f0a14);
      padding: 10px 15px;
      border-bottom: 1px solid var(--gold-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .panel-title { font-size: 0.95rem; color: var(--gold-primary); font-weight: bold; }
    .panel-body { padding: 15px; max-height: 420px; overflow-y: auto; }

    .target-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .target-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #fff;
      padding: 8px 4px;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .target-btn:hover:not(:disabled) {
      border-color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.2);
    }

    .target-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: #333; }
    .target-btn.selected { border-color: var(--crimson-bright); background: rgba(230, 0, 0, 0.3); }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 2000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--panel-bg);
      border: 2px solid var(--gold-primary);
      border-radius: 8px;
      width: 100%;
      max-width: 550px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-gothic);
    }

    .modal-header {
      padding: 15px;
      border-bottom: 1px solid var(--gold-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--gold-primary);
    }

    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }

    .compendium-item { border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding: 10px 0; }
    .compendium-name { font-weight: bold; color: var(--gold-light); margin-bottom: 4px; }
    .compendium-desc { font-size: 0.85rem; color: #ccc; }

    .control-group { margin-bottom: 15px; }
    .control-group label { display: block; font-size: 0.85rem; color: var(--gold-light); margin-bottom: 6px; }
    .control-group input[type="range"] { width: 100%; }

    @media (max-width: 600px) {
      .table-container { grid-template-columns: repeat(3, 1fr); }
      .floating-panel { right: 10px; bottom: 10px; left: 10px; width: auto; }
    }
  </style>
</head>
<body>

  <!-- BGM YouTube 音訊串流 -->
  <iframe id="youtubeBgmPlayer" style="display:none;" width="1" height="1"
    src="https://www.youtube.com/embed/JznO2UvE_uU?enablejsapi=1&autoplay=1&loop=1&playlist=JznO2UvE_uU" 
    allow="autoplay">
  </iframe>

  <!-- 大廳登入畫面 -->
  <div id="lobbyScreen" class="screen-overlay">
    <div class="lobby-card">
      <div class="lobby-title">🏰 哥德暗黑狼人殺</div>
      <div class="lobby-subtitle">Gothic Crimson & Gold Edition</div>
      <input type="text" id="playerNameInput" class="input-gothic" placeholder="請輸入您的玩家暱稱..." value="冒險者">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn-gothic btn-crimson" onclick="createRoom()">🏰 創建房間 (成為房主)</button>
        <button class="btn-gothic" onclick="joinRoom()">🔗 加入房間 (輸入代碼)</button>
        <button class="btn-gothic" onclick="startQuickBotTest()">🤖 快速測試模式 (Bot 填滿)</button>
      </div>
    </div>
  </div>

  <!-- 頂部導覽列 -->
  <header>
    <div class="brand-title">🐺 哥德狼人殺 <span id="roomCodeDisplay" style="font-size: 0.8rem; color: #888;"></span></div>
    <div class="top-actions">
      <button class="btn-gothic" onclick="openMediaModal()">🎥 影音</button>
      <select id="perspectiveSelect" class="btn-gothic" onchange="switchPerspective(this.value)">
        <option value="1">🎯 視角: 1號 (您)</option>
      </select>
      <button class="btn-gothic" onclick="openCompendium()">📖 圖鑑</button>
      <button class="btn-gothic" onclick="openSettings()">⚙️ 設定</button>
    </div>
  </header>

  <!-- 頂部 3 行動態流程資訊欄 -->
  <div class="system-banner-box">
    <div class="banner-line-1" id="bannerPhase">【當前階段：大廳準備中】</div>
    <div class="banner-line-2" id="bannerAnnouncement">🏰 歡迎來到哥德狼人殺，請由房主點擊『開始遊戲流程』...</div>
    <div class="banner-line-3" id="bannerTimer">局勢細節：等待所有玩家連線到位</div>
  </div>

  <!-- 主要版面 -->
  <div class="main-layout">
    <div class="table-container" id="seatTable"></div>
  </div>

  <!-- 可收合懸浮面板 -->
  <div id="floatingPanel" class="floating-panel">
    <div class="panel-header" onclick="toggleFloatingPanel()">
      <span class="panel-title" id="panelTitle">🎮 第一人稱控制台</span>
      <span id="panelToggleIcon">▼</span>
    </div>
    <div class="panel-body" id="panelBody">
      <div id="roleIdentityInfo" style="margin-bottom: 10px; font-size: 0.85rem; color: var(--gold-light);">
        當前身分：載入中...
      </div>
      <div id="actionControls">
        <p style="font-size: 0.8rem; color: #aaa;">請等待遊戲開始或進行視角切換...</p>
      </div>
    </div>
  </div>

  <!-- Modal: 影音控制面板 -->
  <div id="mediaModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🎥 影音與裝置控制面板</h3>
        <span style="cursor:pointer;" onclick="closeModal('mediaModal')">✖</span>
      </div>
      <div class="modal-body">
        <div class="control-group">
          <label>🎵 BGM 背景音樂音量:</label>
          <input type="range" id="bgmSlider" min="0" max="100" value="50" oninput="setBgmVolume(this.value)">
        </div>
        <div class="control-group">
          <label>🎙️ 本機麥克風授權與狀態:</label>
          <div style="display:flex; gap:10px; align-items:center;">
            <input type="range" id="micSlider" min="0" max="100" value="80">
            <button class="btn-gothic" id="micToggleBtn" onclick="toggleSelfMic()">🎤 麥克風: 關</button>
          </div>
        </div>
        <div class="control-group">
          <label>🔊 其他玩家主音量:</label>
          <input type="range" id="masterVolumeSlider" min="0" max="100" value="100">
        </div>
        <div class="control-group">
          <label>📹 本機視訊鏡頭:</label>
          <button class="btn-gothic" id="camToggleBtn" onclick="toggleSelfCam()">📷 鏡頭: 關</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: 房間設定 -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚙️ 房間規則與配置設定 (房主專屬)</h3>
        <span style="cursor:pointer;" onclick="closeModal('settingsModal')">✖</span>
      </div>
      <div class="modal-body">
        <label style="display:block; margin-bottom: 15px;">
          <b>遊戲總人數：</b>
          <select id="playerCountSelect" class="btn-gothic" style="margin-left: 10px;" onchange="updateRolePreview()">
            <option value="6">6 人局</option>
            <option value="9">9 人局</option>
            <option value="12" selected>12 人標準局</option>
            <option value="18">18 人大局</option>
          </select>
        </label>
        
        <div id="rolePreviewBox" style="background: rgba(0,0,0,0.5); border: var(--border-gold); padding: 12px; border-radius: 4px; margin-bottom: 15px; font-size: 0.85rem; line-height: 1.5;"></div>

        <label style="display:block; margin-bottom: 15px;">
          <b>上警模式：</b>
          <select id="sheriffModeSelect" class="btn-gothic" style="margin-left: 10px;">
            <option value="enabled">標準上警 (選出警長，1.5票權重)</option>
            <option value="disabled">無警長模式</option>
          </select>
        </label>

        <div style="margin-top: 20px; text-align: right;">
          <button class="btn-gothic btn-crimson" onclick="applySettingsAndStart()">▶ 套用設定並重新開始</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: 角色圖鑑 -->
  <div id="compendiumModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📖 角色圖鑑 (官方與熱門角色)</h3>
        <span style="cursor:pointer;" onclick="closeModal('compendiumModal')">✖</span>
      </div>
      <div class="modal-body" id="compendiumList"></div>
    </div>
  </div>

  <script>
    function speakGod(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-TW';
        msg.rate = 0.95;
        window.speechSynthesis.speak(msg);
      }
    }

    let roomState = {
      roomId: 'GOTHIC-' + Math.floor(1000 + Math.random() * 9000),
      isHost: true,
      playerCount: 12,
      sheriffMode: 'enabled',
      hasSheriffInGame: false,
      currentPhase: 'LOBBY',
      currentPerspective: 1,
      players: [],
      activeSpeakerId: null,
      speechTimer: 60,
      sheriffTimer: 30,
      votingTimer: 15,
      timerInterval: null,
      sheriffCandidates: [],
      sheriffId: null,
      guardLastTarget: null,
      nightVictim: null,
      executedVictim: null,
      witchElixirUsed: false,
      witchPoisonUsed: false,
      speechQueue: [],
      currentQueueIndex: 0,
      userVotes: {}
    };

    const ROLES = [
      { name: "小狼", camp: "狼人", desc: "狼人陣營基礎角色，夜間可與狼隊共同討論並參與襲擊。" },
      { name: "狼王", camp: "狼人", desc: "出局時可發動開槍技能帶走一名玩家（自爆或被毒死除外）。" },
      { name: "預言家", camp: "好人神職", desc: "每晚可查驗一名玩家陣營（顯示金水好人或查殺狼人）。" },
      { name: "女巫", camp: "好人神職", desc: "擁有解藥（救人）與毒藥（毒人），整局各限用一次。" },
      { name: "守衛", camp: "好人神職", desc: "每晚可守護一名玩家免受夜刀，嚴格禁止連續兩晚守護同一人。" },
      { name: "獵人", camp: "好人神職", desc: "出局時可開槍帶走一名玩家（被毒死除外）。" },
      { name: "平民", camp: "好人陣營", desc: "無夜間技能，憑藉白天發言與邏輯公投幫助好人陣營獲勝。" }
    ];

    window.onload = () => {
      buildCompendium();
      updateRolePreview();
      document.getElementById('roomCodeDisplay').innerText = `[房間 ID: ${roomState.roomId}]`;
    };

    function createRoom() {
      roomState.isHost = true;
      document.getElementById('lobbyScreen').style.display = 'none';
      initPlayers(12);
    }

    function joinRoom() {
      const code = prompt("請輸入 4 位數房間代碼:", "8888");
      if (code) {
        roomState.isHost = false;
        document.getElementById('lobbyScreen').style.display = 'none';
        initPlayers(12);
      }
    }

    function startQuickBotTest() { createRoom(); }

    function initPlayers(count) {
      roomState.playerCount = count;
      roomState.players = [];
      const rolesPool = getRolePoolForCount(count);
      
      for (let i = 1; i <= count; i++) {
        roomState.players.push({
          id: i,
          name: i === 1 ? (document.getElementById('playerNameInput').value || '1號玩家') : `${i}號 Bot`,
          role: rolesPool[(i - 1) % rolesPool.length],
          isAlive: true,
          isSheriff: false,
          micOn: false,
          camOn: false,
          stream: null
        });
      }
      renderTable();
      updatePerspectiveSelect();
      updateControlPanel();
    }

    function getRolePoolForCount(count) {
      if (count === 6) return ["小狼", "小狼", "預言家", "女巫", "平民", "平民"];
      if (count === 9) return ["小狼", "小狼", "狼王", "預言家", "女巫", "獵人", "平民", "平民", "平民"];
      if (count === 12) return ["小狼", "小狼", "小狼", "狼王", "預言家", "女巫", "守衛", "獵人", "平民", "平民", "平民", "平民"];
      return ["小狼", "小狼", "小狼", "小狼", "狼王", "預言家", "女巫", "守衛", "獵人", "平民", "平民", "平民", "平民", "平民", "平民", "平民", "平民", "平民"];
    }

    function updateRolePreview() {
      const count = parseInt(document.getElementById('playerCountSelect').value);
      const pool = getRolePoolForCount(count);
      const wolves = pool.filter(r => r.includes('狼')).length;
      const gods = pool.filter(r => !r.includes('狼') && r !== '平民').length;
      const civs = pool.filter(r => r === '平民').length;
      
      document.getElementById('rolePreviewBox').innerHTML = `
        <b style="color:var(--gold-primary);">📊 ${count} 人局配置預覽：</b><br>
        • 🐺 <b>狼人陣營：</b> ${wolves} 人 (${pool.filter(r=>r.includes('狼')).join(', ')})<br>
        • 🛡️ <b>神職陣營：</b> ${gods} 人 (${pool.filter(r=>!r.includes('狼')&&r!=='平民').join(', ')})<br>
        • 🌾 <b>平民陣營：</b> ${civs} 人 (平民)
      `;
    }

    function renderTable() {
      const table = document.getElementById('seatTable');
      table.innerHTML = '';
      roomState.players.forEach(p => {
        const isCurrentSpeaker = (p.id === roomState.activeSpeakerId);
        const card = document.createElement('div');
        card.className = `seat-card ${!p.isAlive ? 'dead' : ''} ${isCurrentSpeaker ? 'active-speaker' : ''}`;
        card.id = `seat-${p.id}`;
        
        card.innerHTML = `
          ${p.isSheriff ? '<div class="badge-sheriff">👑</div>' : ''}
          <div class="avatar-video-container" id="video-container-${p.id}">
            ${p.camOn && p.stream ? '' : '<span class="avatar-placeholder">📷 鏡頭關閉</span>'}
          </div>
          <div class="seat-info">
            <span>${p.id}. ${p.name}</span>
          </div>
        `;
        table.appendChild(card);

        if (p.camOn && p.stream) {
          const container = document.getElementById(`video-container-${p.id}`);
          const video = document.createElement('video');
          video.className = 'avatar-video';
          video.autoplay = true;
          video.playsInline = true;
          video.muted = (p.id === roomState.currentPerspective);
          video.srcObject = p.stream;
          container.appendChild(video);
        }
      });
    }

    function updatePerspectiveSelect() {
      const select = document.getElementById('perspectiveSelect');
      select.innerHTML = '';
      roomState.players.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.innerText = `🎯 視角: ${p.id}號 (${p.name})`;
        if (p.id === roomState.currentPerspective) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function switchPerspective(id) {
      roomState.currentPerspective = parseInt(id);
      updateControlPanel();
    }

    function updateControlPanel() {
      const p = roomState.players.find(x => x.id === roomState.currentPerspective);
      if (!p) return;

      document.getElementById('roleIdentityInfo').innerHTML = `
        當前視角：<b>${p.id}號 ${p.name}</b><br>
        身分牌：<b style="color:var(--gold-primary);">${p.role}</b> (${p.isAlive ? '存活' : '已出局'})
      `;

      const controls = document.getElementById('actionControls');
      controls.innerHTML = '';

      if (roomState.currentPhase === 'LOBBY') {
        controls.innerHTML = roomState.isHost 
          ? `<button class="btn-gothic btn-crimson" style="width:100%;" onclick="startGameFlow()">▶ 開始遊戲流程</button>` 
          : `<p style="font-size:0.8rem; color:#aaa;">等待房主開啟遊戲...</p>`;
      } 
      else if (roomState.currentPhase === 'NIGHT') {
        renderNightPanel(p, controls);
      }
      else if (roomState.currentPhase === 'SHERIFF_ELECTION') {
        controls.innerHTML = `
          <div style="text-align:center; margin-bottom:8px;">
            <span style="color:var(--gold-light); font-size:0.9rem;">👑 競選舉手倒數：<b style="color:var(--crimson-bright); font-size:1.1rem;"><span id="sheriffTimerSec">${roomState.sheriffTimer}</span>s</b></span>
          </div>
          <button class="btn-gothic" style="width:100%; margin-bottom:8px;" onclick="candidateSheriff(${p.id})">🙋 舉手競選警長</button>
        `;
      }
      else if (roomState.currentPhase === 'DAY_DEATH') {
        if (p.isSheriff) {
          const hasDeath = roomState.nightVictim !== null;
          controls.innerHTML = `
            <div style="margin-bottom:10px;">
              <p style="font-size:0.85rem; color:var(--gold-primary); margin-bottom:8px;">👑 請警長選擇今日發言順序：</p>
              ${hasDeath ? `
                <button class="btn-gothic" style="width:100%; margin-bottom:6px;" onclick="chooseSpeechDirection('死左')">死左 (逆時針)</button>
                <button class="btn-gothic" style="width:100%;" onclick="chooseSpeechDirection('死右')">死右 (順時針)</button>
              ` : `
                <button class="btn-gothic" style="width:100%; margin-bottom:6px;" onclick="chooseSpeechDirection('警左')">警左 (逆時針)</button>
                <button class="btn-gothic" style="width:100%;" onclick="chooseSpeechDirection('警右')">警右 (順時針)</button>
              `}
            </div>
          `;
        } else {
          controls.innerHTML = `<p style="font-size:0.85rem; color:#aaa;">等待警長決定發言順序...</p>`;
        }
      }
      else if (roomState.currentPhase === 'DAY_SPEECH') {
        const isMyTurn = (p.id === roomState.activeSpeakerId);
        const isLastSpeaker = (roomState.currentQueueIndex === roomState.speechQueue.length - 1);

        controls.innerHTML = `
          <div style="text-align:center; margin-bottom:10px;">
            <span style="font-size:1rem; color:var(--gold-light);">當前發言玩家：<b style="color:var(--gold-primary);">${roomState.activeSpeakerId} 號</b></span><br>
            <span style="font-size:1.1rem; color:var(--crimson-bright); font-weight:bold;">⏳ 倒數：<span id="timerSec">${roomState.speechTimer}</span>s</span>
          </div>
          ${isMyTurn ? `
            <div style="display:flex; gap:8px; margin-bottom:10px;">
              <button class="btn-gothic" style="flex:1;" onclick="addSpeechTime()">+60s 加時</button>
              <button class="btn-gothic btn-crimson" style="flex:1;" onclick="endSpeech()">結束發言</button>
            </div>
          ` : `<p style="font-size:0.75rem; color:#888; text-align:center;">目前為 ${roomState.activeSpeakerId} 號發言時間。</p>`}

          ${(p.isSheriff || (!roomState.hasSheriffInGame && isLastSpeaker)) && isMyTurn ? `
            <div style="border-top:1px solid #444; padding-top:8px; margin-top:8px;">
              <label style="font-size:0.8rem; color:var(--gold-primary);">
                <input type="checkbox" id="sheriffSummaryCheck" onchange="toggleSheriffSummary(this.checked)"> ☑ 進行歸票發言
              </label>
              <div id="sheriffTargetBox" style="display:none; margin-top:6px;">
                <select id="sheriffTargetSelect" class="btn-gothic" style="width:100%;">
                  ${roomState.players.filter(x=>x.isAlive).map(x=>`<option value="${x.id}">${x.id}號玩家</option>`).join('')}
                </select>
              </div>
            </div>
          ` : ''}
        `;
      }
      else if (roomState.currentPhase === 'VOTING') {
        renderVotingPanel(p, controls);
      }
      else if (roomState.currentPhase === 'LAST_WORDS') {
        const isMyTurn = (p.id === roomState.executedVictim);
        controls.innerHTML = `
          <div style="text-align:center; margin-bottom:10px;">
            <span style="font-size:1rem; color:var(--gold-light);">💀 發表遺言玩家：<b style="color:var(--crimson-bright);">${roomState.executedVictim} 號</b></span><br>
            <span style="font-size:1.1rem; color:var(--crimson-bright); font-weight:bold;">⏳ 倒數：<span id="timerSec">${roomState.speechTimer}</span>s</span>
          </div>
          ${isMyTurn ? `
            <div style="display:flex; gap:8px;">
              <button class="btn-gothic" style="flex:1;" onclick="addSpeechTime()">+60s 加時</button>
              <button class="btn-gothic btn-crimson" style="flex:1;" onclick="endLastWords()">結束遺言</button>
            </div>
          ` : `<p style="font-size:0.75rem; color:#888; text-align:center;">目前為 ${roomState.executedVictim} 號發表遺言時間。</p>`}
        `;
      }
    }

    function renderNightPanel(p, container) {
      if (!p.isAlive) {
        container.innerHTML = `<p style="color:#888; font-size:0.8rem;">您已出局，請靜觀局勢...</p>`;
        return;
      }

      if (p.role === '預言家') {
        let html = `<p style="font-size:0.8rem; color:var(--gold-light);">🔮 選擇今晚查驗目標：</p><div class="target-grid">`;
        roomState.players.forEach(t => {
          if (t.isAlive && t.id !== p.id) html += `<button class="target-btn" onclick="seerCheck(${t.id})">${t.id}號</button>`;
        });
        html += `</div><div id="seerResult" style="margin-top:10px; font-weight:bold;"></div>`;
        container.innerHTML = html;
      }
      else if (p.role === '女巫') {
        container.innerHTML = `
          <p style="font-size:0.8rem;">🧪 昨晚倒下的是：<b style="color:var(--crimson-bright);">${roomState.nightVictim ? roomState.nightVictim + '號' : '無人死亡'}</b></p>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="btn-gothic" ${roomState.witchElixirUsed ? 'disabled' : ''} onclick="useWitchElixir()">${roomState.witchElixirUsed ? '解藥(已用)' : '解藥救人'}</button>
            <button class="btn-gothic btn-crimson" ${roomState.witchPoisonUsed ? 'disabled' : ''} onclick="useWitchPoison()">${roomState.witchPoisonUsed ? '毒藥(已用)' : '毒藥毒人'}</button>
          </div>
        `;
      }
      else if (p.role === '守衛') {
        let html = `<p style="font-size:0.8rem;">🛡️ 選擇守護目標 (不可連守)：</p><div class="target-grid">`;
        roomState.players.forEach(t => {
          if (t.isAlive) {
            const isDisabled = t.id === roomState.guardLastTarget;
            html += `<button class="target-btn" ${isDisabled ? 'disabled' : ''} onclick="guardProtect(${t.id})">${t.id}號</button>`;
          }
        });
        html += `</div>`;
        container.innerHTML = html;
      }
      else if (p.role.includes('狼')) {
        let html = `<p style="font-size:0.8rem; color:var(--crimson-bright);">🐺 狼隊討論夜刀標靶：</p><div class="target-grid">`;
        roomState.players.forEach(t => {
          if (t.isAlive) html += `<button class="target-btn" onclick="wolfKillTarget(${t.id})">${t.id}號</button>`;
        });
        html += `</div>`;
        container.innerHTML = html;
      }
      else {
        container.innerHTML = `<p style="font-size:0.85rem; color:#aaa; text-align:center; padding:15px 0;">🌙 天黑請閉眼，請靜候天亮...</p>`;
      }
    }

    function seerCheck(targetId) {
      const target = roomState.players.find(x => x.id === targetId);
      const isWolf = target.role.includes('狼');
      document.getElementById('seerResult').innerHTML = `查驗結果：${targetId}號 是 <span style="color:${isWolf ? 'var(--crimson-bright)' : 'var(--gold-primary)'};">${isWolf ? '🐺 狼人陣營 (查殺)' : '💧 好人陣營 (金水)'}</span>`;
    }

    function useWitchElixir() { roomState.witchElixirUsed = true; alert("已使用解藥"); updateControlPanel(); }
    function useWitchPoison() {
      const t = prompt("請輸入要毒殺的號碼:");
      if (t) { roomState.witchPoisonUsed = true; alert(`已毒殺 ${t} 號`); updateControlPanel(); }
    }
    function guardProtect(targetId) { roomState.guardLastTarget = targetId; alert(`今晚守護 ${targetId} 號`); updateControlPanel(); }
    function wolfKillTarget(targetId) { roomState.nightVictim = targetId; alert(`狼隊指定襲擊 ${targetId} 號`); }

    // 公投選擇面板（支援棄票高亮與點擊送出）
    function renderVotingPanel(p, container) {
      if (!p.isAlive) {
        container.innerHTML = `<p style="color:#888; font-size:0.8rem;">您已出局，無投票權。</p>`;
        return;
      }

      let html = `<p style="font-size:0.8rem; color:var(--gold-light);">⚖️ 請選擇公投處決目標 (倒數 ${roomState.votingTimer}s)：</p><div class="target-grid">`;
      roomState.players.forEach(t => {
        html += `<button class="target-btn" id="voteBtn-${t.id}" ${!t.isAlive ? 'disabled' : ''} onclick="selectVoteTarget(${t.id})">${t.id}號</button>`;
      });
      html += `</div>
        <button class="target-btn" id="voteBtn-0" style="width:100%; margin-top:8px;" onclick="selectVoteTarget(0)">棄票 (不投票)</button>
        <button class="btn-gothic btn-crimson" style="width:100%; margin-top:10px;" onclick="confirmVote()">✅ 確認投票</button>
      `;
      container.innerHTML = html;
    }

    let currentVoteTarget = null;
    function selectVoteTarget(id) {
      currentVoteTarget = id;
      document.querySelectorAll('.target-btn').forEach(b => b.classList.remove('selected'));
      const btn = document.getElementById(`voteBtn-${id}`);
      if (btn) btn.classList.add('selected');
    }

    function confirmVote() {
      if (currentVoteTarget === null) { alert("請先點擊選定處決號碼或棄票！"); return; }
      roomState.userVotes[roomState.currentPerspective] = currentVoteTarget;
      alert(currentVoteTarget === 0 ? "已確認棄票！" : `已確認投票處決 ${currentVoteTarget} 號！`);
    }

    // 遊戲流程控制與狀態機
    function startGameFlow() {
      roomState.currentPhase = 'NIGHT';
      updateBanner("【夜間行動】", "🌙 天黑請閉眼，請守衛 ➔ 狼人 ➔ 女巫 ➔ 預言家 依序執行技能...", "請各神職私密操作，絕不洩漏戰報");
      speakGod("天黑請閉眼，請守衛、狼人、女巫、預言家依序睜眼執行技能。");
      updateControlPanel();

      setTimeout(() => {
        if (roomState.sheriffMode === 'enabled') {
          roomState.currentPhase = 'SHERIFF_ELECTION';
          startSheriffCountdown();
        } else {
          roomState.hasSheriffInGame = false;
          announceDayDeath();
        }
      }, 10000);
    }

    function startSheriffCountdown() {
      roomState.sheriffTimer = 30;
      updateBanner("【警長競選】", "🌅 天將破曉，請競選警長的玩家舉手...", `舉手倒數：30s`);
      speakGod("天將破曉，請競選警長的玩家舉手。");
      updateControlPanel();

      clearInterval(roomState.timerInterval);
      roomState.timerInterval = setInterval(() => {
        roomState.sheriffTimer--;
        updateBanner("【警長競選】", "🌅 天將破曉，請競選警長的玩家舉手...", `舉手倒數：${roomState.sheriffTimer}s`);
        if (roomState.sheriffTimer <= 0) {
          clearInterval(roomState.timerInterval);
          processSheriffCandidates();
        }
      }, 1000);
    }

    function candidateSheriff(id) {
      if (!roomState.sheriffCandidates.includes(id)) {
        roomState.sheriffCandidates.push(id);
        const card = document.getElementById(`seat-${id}`);
        if (card) card.classList.add('highlight');
      }
    }

    function processSheriffCandidates() {
      if (roomState.sheriffCandidates.length === 0) {
        roomState.hasSheriffInGame = false;
        speakGod("本局無人競選警長，本局無警長！進入白天發言。");
        announceDayDeath();
      } else {
        roomState.hasSheriffInGame = true;
        const winner = roomState.sheriffCandidates[0];
        roomState.sheriffId = winner;
        roomState.players.find(x => x.id === winner).isSheriff = true;
        renderTable();
        speakGod(`${winner} 號玩家當選警長！`);
        announceDayDeath();
      }
    }

    function announceDayDeath() {
      const text = roomState.nightVictim ? `昨夜 ${roomState.nightVictim} 號玩家慘遭襲擊倒下！` : "昨夜是平安夜，無人倒下！";
      
      if (roomState.nightVictim) {
        const p = roomState.players.find(x => x.id === roomState.nightVictim);
        if (p) p.isAlive = false;
        renderTable();
      }

      if (roomState.hasSheriffInGame) {
        roomState.currentPhase = 'DAY_DEATH';
        updateBanner("【天亮死訊】", `☀️ 天亮了！${text}`, "請警長指定白天發言方向");
        speakGod(`天亮了。${text} 請警長選擇發言順序。`);
        updateControlPanel();
      } else {
        const alivePlayers = roomState.players.filter(p => p.isAlive).map(p => p.id);
        const randomStart = alivePlayers[Math.floor(Math.random() * alivePlayers.length)];
        speakGod(`天亮了。${text} 本局無警長，隨機由 ${randomStart} 號玩家開始發言。`);
        startNoSheriffSpeech(randomStart);
      }
    }

    function chooseSpeechDirection(dir) {
      updateBanner("【白天輪流發言】", `👑 警長指定發言順序：【${dir}】`, "每人發言 60s，自動跳過出局玩家");
      speakGod(`警長指定發言順序為 ${dir}。`);
      
      let startId = 1;
      if (roomState.nightVictim) {
        startId = dir.includes('左') ? (roomState.nightVictim - 1 || roomState.playerCount) : (roomState.nightVictim % roomState.playerCount + 1);
      } else {
        startId = dir.includes('左') ? (roomState.sheriffId - 1 || roomState.playerCount) : (roomState.sheriffId % roomState.playerCount + 1);
      }

      buildSpeechQueue(startId, dir.includes('右'));
      startNextSpeaker();
    }

    function startNoSheriffSpeech(startId) {
      updateBanner("【白天輪流發言】", `📢 無警長模式：由 ${startId} 號玩家開始順時針發言`, "末位發言者進行歸票");
      buildSpeechQueue(startId, true);
      startNextSpeaker();
    }

    // 建立發言隊列 (精準過濾掉 isAlive: false 玩家)
    function buildSpeechQueue(startId, isClockwise) {
      roomState.speechQueue = [];
      let current = startId;
      for (let i = 0; i < roomState.playerCount; i++) {
        const p = roomState.players.find(x => x.id === current);
        if (p && p.isAlive) {
          roomState.speechQueue.push(current);
        }
        current = isClockwise ? (current % roomState.playerCount + 1) : (current - 1 || roomState.playerCount);
      }
      roomState.currentQueueIndex = -1;
    }

    function startNextSpeaker() {
      roomState.currentQueueIndex++;
      if (roomState.currentQueueIndex >= roomState.speechQueue.length) {
        enterVotingPhase();
        return;
      }

      roomState.currentPhase = 'DAY_SPEECH';
      roomState.activeSpeakerId = roomState.speechQueue[roomState.currentQueueIndex];
      renderTable();
      startSpeechTimer();
      updateControlPanel();
    }

    function startSpeechTimer() {
      roomState.speechTimer = 60;
      clearInterval(roomState.timerInterval);
      updateBanner("【白天輪流發言】", `📢 當前輪到 ${roomState.activeSpeakerId} 號玩家發言`, `發言時間剩餘：${roomState.speechTimer}s`);
      
      roomState.timerInterval = setInterval(() => {
        roomState.speechTimer--;
        updateBanner("【白天輪流發言】", `📢 當前輪到 ${roomState.activeSpeakerId} 號玩家發言`, `發言時間剩餘：${roomState.speechTimer}s`);
        if (roomState.speechTimer <= 0) {
          endSpeech();
        }
      }, 1000);
    }

    function addSpeechTime() {
      roomState.speechTimer += 60;
      updateControlPanel();
    }

    function endSpeech() {
      clearInterval(roomState.timerInterval);
      startNextSpeaker();
    }

    function toggleSheriffSummary(checked) {
      document.getElementById('sheriffTargetBox').style.display = checked ? 'block' : 'none';
    }

    function enterVotingPhase() {
      roomState.currentPhase = 'VOTING';
      roomState.votingTimer = 15;
      currentVoteTarget = null;
      roomState.userVotes = {};

      updateBanner("【公投處決階段】", "⚖️ 請所有人於 15 秒內選擇處決目標並點擊『確認投票』...", "未投票者自動判定為棄票");
      speakGod("發言結束，進入公投處決階段。請全體玩家於十五秒內選擇目標並點擊確認投票。");
      renderTable();
      updateControlPanel();

      clearInterval(roomState.timerInterval);
      roomState.timerInterval = setInterval(() => {
        roomState.votingTimer--;
        updateBanner("【公投處決階段】", "⚖️ 請所有人於 15 秒內選擇處決目標並點擊『確認投票』...", `公投倒數：${roomState.votingTimer}s`);
        if (roomState.votingTimer <= 0) {
          clearInterval(roomState.timerInterval);
          finalizePublicVote();
        }
      }, 1000);
    }

    // 結算公投並進入遺言階段
    function finalizePublicVote() {
      const alivePlayers = roomState.players.filter(p => p.isAlive);
      const voteCounts = {};
      
      alivePlayers.forEach(p => {
        const target = roomState.userVotes[p.id] !== undefined ? roomState.userVotes[p.id] : 0;
        if (target !== 0) {
          voteCounts[target] = (voteCounts[target] || 0) + (p.isSheriff ? 1.5 : 1);
        }
      });

      let highestVoteTarget = null;
      let maxVotes = 0;
      for (const [target, votes] of Object.entries(voteCounts)) {
        if (votes > maxVotes) {
          maxVotes = votes;
          highestVoteTarget = parseInt(target);
        }
      }

      if (highestVoteTarget) {
        roomState.executedVictim = highestVoteTarget;
        const victim = roomState.players.find(x => x.id === highestVoteTarget);
        if (victim) victim.isAlive = false;
        renderTable();

        speakGod(`公投結算結束，最高票數者為 ${highestVoteTarget} 號玩家！此玩家處決出局，請發表遺言。`);
        startLastWordsPhase(highestVoteTarget);
      } else {
        speakGod("公投結算結束，全員棄票，今日為平安日！天黑請閉眼。");
        setTimeout(startGameFlow, 4000);
      }
    }

    function startLastWordsPhase(victimId) {
      roomState.currentPhase = 'LAST_WORDS';
      roomState.activeSpeakerId = victimId;
      roomState.speechTimer = 60;
      renderTable();
      updateControlPanel();

      updateBanner("【發表遺言階段】", `💀 由處決出局的 ${victimId} 號玩家發表遺言`, `遺言剩餘時間：${roomState.speechTimer}s`);

      clearInterval(roomState.timerInterval);
      roomState.timerInterval = setInterval(() => {
        roomState.speechTimer--;
        updateBanner("【發表遺言階段】", `💀 由處決出局的 ${victimId} 號玩家發表遺言`, `遺言剩餘時間：${roomState.speechTimer}s`);
        if (roomState.speechTimer <= 0) {
          endLastWords();
        }
      }, 1000);
    }

    function endLastWords() {
      clearInterval(roomState.timerInterval);
      speakGod("遺言發表結束，天黑請閉眼。");
      updateBanner("【夜間準備】", "🌙 遺言結束，進入下一夜...", "準備中...");
      setTimeout(startGameFlow, 3000);
    }

    function updateBanner(line1, line2, line3) {
      document.getElementById('bannerPhase').innerText = line1;
      document.getElementById('bannerAnnouncement').innerText = line2;
      document.getElementById('bannerTimer').innerText = line3;
    }

    function toggleFloatingPanel() {
      const panel = document.getElementById('floatingPanel');
      panel.classList.toggle('collapsed');
      document.getElementById('panelToggleIcon').innerText = panel.classList.contains('collapsed') ? '▲' : '▼';
    }

    function openMediaModal() { document.getElementById('mediaModal').style.display = 'flex'; }
    function openSettings() {
      if (!roomState.isHost) { alert("只有房主可以更改規則！"); return; }
      document.getElementById('settingsModal').style.display = 'flex';
    }
    function openCompendium() { document.getElementById('compendiumModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function setBgmVolume(val) {
      const iframe = document.getElementById('youtubeBgmPlayer');
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage(`{"event":"command","func":"setVolume","args":[${val}]}`, '*');
      }
    }

    async function toggleSelfMic() {
      const p = roomState.players.find(x => x.id === roomState.currentPerspective);
      if (!p) return;

      if (!p.micOn) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: p.camOn });
          p.micOn = true;
          p.stream = stream;
        } catch (e) { alert("無法取得麥克風授權！"); return; }
      } else {
        if (p.stream) p.stream.getAudioTracks().forEach(t => t.stop());
        p.micOn = false;
      }
      document.getElementById('micToggleBtn').innerText = p.micOn ? '🎤 麥克風: 開' : '🎤 麥克風: 關';
      renderTable();
    }

    async function toggleSelfCam() {
      const p = roomState.players.find(x => x.id === roomState.currentPerspective);
      if (!p) return;
      
      if (!p.camOn) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: p.micOn });
          p.camOn = true;
          p.stream = stream;
        } catch (e) { alert("無法取得攝影機授權！"); return; }
      } else {
        if (p.stream) p.stream.getVideoTracks().forEach(t => t.stop());
        p.camOn = false;
      }
      document.getElementById('camToggleBtn').innerText = p.camOn ? '📹 鏡頭: 開' : '📷 鏡頭: 關';
      renderTable();
    }

    function buildCompendium() {
      const list = document.getElementById('compendiumList');
      list.innerHTML = '';
      ROLES.forEach(r => {
        list.innerHTML += `
          <div class="compendium-item">
            <div class="compendium-name">${r.name} <span style="font-size:0.75rem; color:var(--gold-primary);">[${r.camp}]</span></div>
            <div class="compendium-desc">${r.desc}</div>
          </div>
        `;
      });
    }

    function applySettingsAndStart() {
      const count = parseInt(document.getElementById('playerCountSelect').value);
      roomState.sheriffMode = document.getElementById('sheriffModeSelect').value;
      closeModal('settingsModal');
      initPlayers(count);
      alert(`已將房間設置為 ${count} 人局！`);
    }
  </script>
</body>
</html>
