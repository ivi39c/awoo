<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gothic Crimson & Gold - 哥德暗黑狼人殺視訊平台</title>
  <style>
    :root {
      --bg-color: #0b080d;
      --panel-bg: rgba(22, 16, 28, 0.95);
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --crimson-red: #8b0000;
      --crimson-bright: #e60000;
      --text-color: #e8e6e3;
      --border-gold: 1px solid rgba(212, 175, 55, 0.4);
      --shadow-gothic: 0 8px 32px rgba(0, 0, 0, 0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cinzel', 'Noto Serif TC', serif; }

    body {
      background: #000 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%230b080d"/><path d="M0 0l100 100M100 0L0 100" stroke="%231a1220" stroke-width="0.5"/></svg>');
      color: var(--text-color);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 頂部導覽列 */
    header {
      background: rgba(11, 8, 13, 0.95);
      border-bottom: 2px solid var(--gold-primary);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
      z-index: 100;
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--gold-primary);
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* 按鈕樣式 */
    .btn-gothic {
      background: linear-gradient(135deg, #1f1427, #0f0a14);
      color: var(--gold-light);
      border: var(--border-gold);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-gothic:hover {
      background: linear-gradient(135deg, #321f40, #1a1024);
      border-color: var(--gold-primary);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
      color: #fff;
    }

    .btn-crimson {
      background: linear-gradient(135deg, var(--crimson-red), #4a0000);
      border-color: var(--crimson-bright);
      color: #fff;
    }

    .btn-crimson:hover {
      background: linear-gradient(135deg, var(--crimson-bright), #660000);
      box-shadow: 0 0 15px rgba(230, 0, 0, 0.6);
    }

    /* 廣報引導列 */
    .system-banner {
      background: linear-gradient(90deg, rgba(20,10,30,0.9), rgba(139,0,0,0.4), rgba(20,10,30,0.9));
      border-bottom: 1px solid var(--gold-primary);
      padding: 10px 15px;
      text-align: center;
      font-size: 0.95rem;
      color: var(--gold-light);
      text-shadow: 0 1px 3px #000;
      letter-spacing: 1px;
    }

    /* 大廳登入畫面 */
    .screen-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 5, 10, 0.96);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .lobby-card {
      background: var(--panel-bg);
      border: 2px solid var(--gold-primary);
      border-radius: 8px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow-gothic);
      text-align: center;
    }

    .lobby-title {
      font-size: 1.8rem;
      color: var(--gold-primary);
      margin-bottom: 10px;
    }

    .lobby-subtitle {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 25px;
    }

    .input-gothic {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: var(--border-gold);
      color: #fff;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 1rem;
    }

    /* 主要版面 Layout */
    .main-layout {
      display: flex;
      flex: 1;
      padding: 15px;
      gap: 15px;
      position: relative;
    }

    /* 視訊牌桌區 */
    .table-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .seat-card {
      background: var(--panel-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: all 0.3s ease;
    }

    .seat-card.highlight {
      border-color: var(--gold-primary);
      box-shadow: 0 0 15px var(--gold-primary);
    }

    .seat-card.dead {
      opacity: 0.4;
      filter: grayscale(1);
    }

    .badge-sheriff {
      position: absolute;
      top: -8px;
      left: -8px;
      background: var(--gold-primary);
      color: #000;
      font-weight: bold;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.75rem;
      box-shadow: 0 0 8px var(--gold-primary);
      z-index: 10;
    }

    .avatar-video-container {
      width: 100%;
      height: 95px;
      background: #000;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 6px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .avatar-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-placeholder {
      font-size: 0.75rem;
      color: #666;
    }

    .seat-info {
      font-size: 0.8rem;
      color: var(--gold-light);
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .media-controls {
      display: flex;
      gap: 5px;
      margin-top: 5px;
    }

    .media-btn {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #444;
      color: #ccc;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .media-btn.active { color: var(--gold-primary); border-color: var(--gold-primary); }

    /* 可收合懸浮面板 */
    .floating-panel {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 340px;
      max-width: calc(100vw - 40px);
      background: var(--panel-bg);
      border: 2px solid var(--gold-primary);
      border-radius: 8px;
      box-shadow: var(--shadow-gothic);
      z-index: 500;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .floating-panel.collapsed {
      transform: translateY(calc(100% - 45px));
    }

    .panel-header {
      background: linear-gradient(90deg, #1f1427, #0f0a14);
      padding: 10px 15px;
      border-bottom: 1px solid var(--gold-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .panel-title {
      font-size: 0.95rem;
      color: var(--gold-primary);
      font-weight: bold;
    }

    .panel-body {
      padding: 15px;
      max-height: 400px;
      overflow-y: auto;
    }

    .target-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .target-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #fff;
      padding: 8px 4px;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .target-btn:hover:not(:disabled) {
      border-color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.2);
    }

    .target-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #333;
    }

    .target-btn.selected {
      border-color: var(--crimson-bright);
      background: rgba(230, 0, 0, 0.3);
    }

    /* Modal 彈窗 */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 2000;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--panel-bg);
      border: 2px solid var(--gold-primary);
      border-radius: 8px;
      width: 100%;
      max-width: 550px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-gothic);
    }

    .modal-header {
      padding: 15px;
      border-bottom: 1px solid var(--gold-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--gold-primary);
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .compendium-item {
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      padding: 10px 0;
    }

    .compendium-name {
      font-weight: bold;
      color: var(--gold-light);
      margin-bottom: 4px;
    }

    .compendium-desc {
      font-size: 0.85rem;
      color: #ccc;
    }

    @media (max-width: 600px) {
      .table-container { grid-template-columns: repeat(3, 1fr); }
      .floating-panel { right: 10px; bottom: 10px; left: 10px; width: auto; }
    }
  </style>
</head>
<body>

  <!-- 大廳登入畫面 -->
  <div id="lobbyScreen" class="screen-overlay">
    <div class="lobby-card">
      <div class="lobby-title">🏰 哥德暗黑狼人殺</div>
      <div class="lobby-subtitle">Gothic Crimson & Gold Edition</div>
      <input type="text" id="playerNameInput" class="input-gothic" placeholder="請輸入您的玩家暱稱..." value="冒險者">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn-gothic btn-crimson" onclick="createRoom()">🏰 創建房間 (成為房主)</button>
        <button class="btn-gothic" onclick="joinRoom()">🔗 加入房間 (輸入代碼)</button>
        <button class="btn-gothic" onclick="startQuickBotTest()">🤖 快速測試模式 (Bot 填滿)</button>
      </div>
    </div>
  </div>

  <!-- 頂部導覽列 -->
  <header>
    <div class="brand-title">🐺 哥德狼人殺 <span id="roomCodeDisplay" style="font-size: 0.8rem; color: #888;"></span></div>
    <div class="top-actions">
      <select id="perspectiveSelect" class="btn-gothic" onchange="switchPerspective(this.value)">
        <option value="1">🎯 視角: 1號 (您)</option>
      </select>
      <button class="btn-gothic" onclick="openCompendium()">📖 圖鑑</button>
      <button class="btn-gothic" onclick="openSettings()">⚙️ 設定</button>
    </div>
  </header>

  <!-- 廣報引導列 -->
  <div id="systemBanner" class="system-banner">
    🏰 歡迎來到哥德狼人殺，請由房主點擊開始遊戲...
  </div>

  <!-- 主要版面 -->
  <div class="main-layout">
    <div class="table-container" id="seatTable"></div>
  </div>

  <!-- 可收合懸浮面板 -->
  <div id="floatingPanel" class="floating-panel">
    <div class="panel-header" onclick="toggleFloatingPanel()">
      <span class="panel-title" id="panelTitle">🎮 第一人稱控制台</span>
      <span id="panelToggleIcon">▼</span>
    </div>
    <div class="panel-body" id="panelBody">
      <div id="roleIdentityInfo" style="margin-bottom: 10px; font-size: 0.85rem; color: var(--gold-light);">
        當前身分：載入中...
      </div>
      <div id="actionControls">
        <p style="font-size: 0.8rem; color: #aaa;">請等待遊戲開始或進行視角切換...</p>
      </div>
    </div>
  </div>

  <!-- Modal: 房間設定 (含即時陣營人數顯示) -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚙️ 房間規則與配置設定 (房主專屬)</h3>
        <span style="cursor:pointer;" onclick="closeModal('settingsModal')">✖</span>
      </div>
      <div class="modal-body">
        <label style="display:block; margin-bottom: 15px;">
          <b>遊戲總人數：</b>
          <select id="playerCountSelect" class="btn-gothic" style="margin-left: 10px;" onchange="updateRolePreview()">
            <option value="6">6 人局</option>
            <option value="9">9 人局</option>
            <option value="12" selected>12 人標準局</option>
            <option value="18">18 人大局</option>
          </select>
        </label>
        
        <div id="rolePreviewBox" style="background: rgba(0,0,0,0.5); border: var(--border-gold); padding: 12px; border-radius: 4px; margin-bottom: 15px; font-size: 0.85rem; line-height: 1.5;">
          <!-- 動態顯示人數結構 -->
        </div>

        <label style="display:block; margin-bottom: 15px;">
          <b>上警模式：</b>
          <select id="sheriffModeSelect" class="btn-gothic" style="margin-left: 10px;">
            <option value="enabled">標準上警 (選出警長，1.5票權重)</option>
            <option value="disabled">無警長模式</option>
          </select>
        </label>

        <div style="margin-top: 20px; text-align: right;">
          <button class="btn-gothic btn-crimson" onclick="applySettingsAndStart()">▶ 套用設定並重新開始</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: 角色圖鑑 -->
  <div id="compendiumModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📖 角色圖鑑 (官方與熱門角色)</h3>
        <span style="cursor:pointer;" onclick="closeModal('compendiumModal')">✖</span>
      </div>
      <div class="modal-body" id="compendiumList"></div>
    </div>
  </div>

  <script>
    let roomState = {
      roomId: 'GOTHIC-' + Math.floor(1000 + Math.random() * 9000),
      isHost: true,
      playerCount: 12,
      sheriffMode: 'enabled',
      currentPhase: 'LOBBY',
      currentPerspective: 1,
      players: [],
      speechTimer: 60,
      sheriffTimer: 30,
      timerInterval: null,
      witchElixirUsed: false,
      witchPoisonUsed: false,
      guardLastTarget: null,
      nightVictim: null
    };

    const ROLES = [
      { name: "小狼", camp: "狼人", desc: "狼人陣營基礎角色，夜間可與狼隊共同討論並參與襲擊。" },
      { name: "狼王", camp: "狼人", desc: "出局時可發動開槍技能帶走一名玩家（自爆或被毒死除外）。" },
      { name: "白狼王", camp: "狼人", desc: "白天發言階段可選擇自爆，並強制帶走現場一名玩家。" },
      { name: "預言家", camp: "好人神職", desc: "每晚可查驗一名玩家陣營（顯示金水好人或查殺狼人）。" },
      { name: "女巫", camp: "好人神職", desc: "擁有解藥（救人）與毒藥（毒人），整局各限用一次。" },
      { name: "守衛", camp: "好人神職", desc: "每晚可守護一名玩家免受夜刀，嚴格禁止連續兩晚守護同一人。" },
      { name: "獵人", camp: "好人神職", desc: "出局時可開槍帶走一名玩家（被毒死除外）。" },
      { name: "平民", camp: "好人陣營", desc: "無夜間技能，憑藉白天發言與邏輯公投幫助好人陣營獲勝。" }
    ];

    window.onload = () => {
      buildCompendium();
      updateRolePreview();
      document.getElementById('roomCodeDisplay').innerText = `[房間 ID: ${roomState.roomId}]`;
    };

    function createRoom() {
      roomState.isHost = true;
      document.getElementById('lobbyScreen').style.display = 'none';
      initPlayers(12);
    }

    function joinRoom() {
      const code = prompt("請輸入 4 位數房間代碼:", "8888");
      if (code) {
        roomState.isHost = false;
        document.getElementById('lobbyScreen').style.display = 'none';
        initPlayers(12);
      }
    }

    function startQuickBotTest() {
      createRoom();
    }

    function initPlayers(count) {
      roomState.playerCount = count;
      roomState.players = [];
      const rolesPool = getRolePoolForCount(count);
      
      for (let i = 1; i <= count; i++) {
        roomState.players.push({
          id: i,
          name: i === 1 ? (document.getElementById('playerNameInput').value || '1號玩家') : `${i}號 Bot`,
          role: rolesPool[(i - 1) % rolesPool.length],
          isAlive: true,
          isSheriff: false,
          micOn: false,
          camOn: false,
          stream: null
        });
      }
      renderTable();
      updatePerspectiveSelect();
      updateControlPanel();
    }

    function getRolePoolForCount(count) {
      if (count === 6) return ["小狼", "小狼", "預言家", "女巫", "平民", "平民"];
      if (count === 9) return ["小狼", "小狼", "狼王", "預言家", "女巫", "獵人", "平民", "平民", "平民"];
      if (count === 12) return ["小狼", "小狼", "小狼", "狼王", "預言家", "女巫", "守衛", "獵人", "平民", "平民", "平民", "平民"];
      return ["小狼", "小狼", "小狼", "小狼", "狼王", "狼美人", "預言家", "女巫", "守衛", "獵人", "白痴", "平民", "平民", "平民", "平民", "平民", "平民", "平民"];
    }

    function updateRolePreview() {
      const count = parseInt(document.getElementById('playerCountSelect').value);
      const pool = getRolePoolForCount(count);
      const wolves = pool.filter(r => r.includes('狼')).length;
      const gods = pool.filter(r => !r.includes('狼') && r !== '平民').length;
      const civs = pool.filter(r => r === '平民').length;
      
      document.getElementById('rolePreviewBox').innerHTML = `
        <b style="color:var(--gold-primary);">📊 ${count} 人局配置預覽：</b><br>
        • 🐺 <b>狼人陣營：</b> ${wolves} 人 (${pool.filter(r=>r.includes('狼')).join(', ')})<br>
        • 🛡️ <b>神職陣營：</b> ${gods} 人 (${pool.filter(r=>!r.includes('狼')&&r!=='平民').join(', ')})<br>
        • 🌾 <b>平民陣營：</b> ${civs} 人 (平民)
      `;
    }

    function renderTable() {
      const table = document.getElementById('seatTable');
      table.innerHTML = '';
      roomState.players.forEach(p => {
        const card = document.createElement('div');
        card.className = `seat-card ${!p.isAlive ? 'dead' : ''}`;
        card.id = `seat-${p.id}`;
        
        card.innerHTML = `
          ${p.isSheriff ? '<div class="badge-sheriff">👑</div>' : ''}
          <div class="avatar-video-container" id="video-container-${p.id}">
            ${p.camOn && p.stream ? '' : '<span class="avatar-placeholder">📷 鏡頭關閉</span>'}
          </div>
          <div class="seat-info">
            <span>${p.id}. ${p.name}</span>
          </div>
          <div class="media-controls">
            <button class="media-btn ${p.micOn ? 'active' : ''}" onclick="toggleMedia(${p.id}, 'mic')">🎤</button>
            <button class="media-btn ${p.camOn ? 'active' : ''}" onclick="toggleMedia(${p.id}, 'cam')">📹</button>
          </div>
        `;
        table.appendChild(card);

        // 如果有視訊串流，動態掛載 video 元素
        if (p.camOn && p.stream) {
          const container = document.getElementById(`video-container-${p.id}`);
          const video = document.createElement('video');
          video.className = 'avatar-video';
          video.autoplay = true;
          video.playsInline = true;
          video.muted = (p.id === roomState.currentPerspective);
          video.srcObject = p.stream;
          container.appendChild(video);
        }
      });
    }

    // 真實裝置麥克風與攝影機授權 (getUserMedia)
    async function toggleMedia(id, type) {
      const p = roomState.players.find(x => x.id === id);
      if (!p) return;

      if (id === roomState.currentPerspective) {
        try {
          if (type === 'cam') {
            if (!p.camOn) {
              const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: p.micOn });
              p.camOn = true;
              p.stream = stream;
            } else {
              if (p.stream) p.stream.getVideoTracks().forEach(t => t.stop());
              p.camOn = false;
            }
          } else if (type === 'mic') {
            if (!p.micOn) {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: p.camOn });
              p.micOn = true;
              p.stream = stream;
            } else {
              if (p.stream) p.stream.getAudioTracks().forEach(t => t.stop());
              p.micOn = false;
            }
          }
        } catch (err) {
          alert("無法取得本機裝置授權 (麥克風/攝影機遭拒絕或未連接)");
          console.error(err);
          return;
        }
      } else {
        // Bot 切換模擬
        if (type === 'mic') p.micOn = !p.micOn;
        if (type === 'cam') p.camOn = !p.camOn;
      }
      renderTable();
    }

    function updatePerspectiveSelect() {
      const select = document.getElementById('perspectiveSelect');
      select.innerHTML = '';
      roomState.players.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.innerText = `🎯 視角: ${p.id}號 (${p.name})`;
        if (p.id === roomState.currentPerspective) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function switchPerspective(id) {
      roomState.currentPerspective = parseInt(id);
      updateControlPanel();
    }

    function updateControlPanel() {
      const p = roomState.players.find(x => x.id === roomState.currentPerspective);
      if (!p) return;

      document.getElementById('roleIdentityInfo').innerHTML = `
        當前視角：<b>${p.id}號 ${p.name}</b><br>
        身分牌：<b style="color:var(--gold-primary);">${p.role}</b> (${p.isAlive ? '存活' : '已出局'})
      `;

      const controls = document.getElementById('actionControls');
      controls.innerHTML = '';

      if (roomState.currentPhase === 'LOBBY') {
        controls.innerHTML = roomState.isHost 
          ? `<button class="btn-gothic btn-crimson" style="width:100%;" onclick="startGameFlow()">▶ 開始遊戲流程</button>` 
          : `<p style="font-size:0.8rem; color:#aaa;">等待房主開啟遊戲...</p>`;
      } 
      else if (roomState.currentPhase === 'NIGHT') {
        renderNightPanel(p, controls);
      }
      else if (roomState.currentPhase === 'SHERIFF_ELECTION') {
        controls.innerHTML = `
          <div style="text-align:center; margin-bottom:8px;">
            <span style="color:var(--gold-light); font-size:0.9rem;">👑 競選倒數：<b style="color:var(--crimson-bright); font-size:1.1rem;"><span id="sheriffTimerSec">${roomState.sheriffTimer}</span>s</b></span>
          </div>
          <button class="btn-gothic" style="width:100%; margin-bottom:8px;" onclick="candidateSheriff(${p.id})">🙋 舉手競選警長</button>
          <p style="font-size:0.75rem; color:#888;">點擊後卡片將高亮金色金框。</p>
        `;
      }
      else if (roomState.currentPhase === 'DAY_SPEECH') {
        if (p.isSheriff) {
          controls.innerHTML += `
            <div style="margin-bottom:10px; border-bottom:1px solid #444; padding-bottom:8px;">
              <span style="font-size:0.8rem; color:var(--gold-primary);">👑 警長發言順序指示：</span><br>
              <button class="btn-gothic" style="margin-top:5px;" onclick="setSpeechOrder('死左 / 警左')">死左 / 警左</button>
              <button class="btn-gothic" style="margin-top:5px;" onclick="setSpeechOrder('死右 / 警右')">死右 / 警右</button>
            </div>
          `;
        }
        controls.innerHTML += `
          <div style="text-align:center; margin-bottom:10px;">
            <span style="font-size:1.1rem; color:var(--crimson-bright); font-weight:bold;">⏳ 發言倒數：<span id="timerSec">${roomState.speechTimer}</span>s</span>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn-gothic" style="flex:1;" onclick="addSpeechTime()">+60s 加時</button>
            <button class="btn-gothic btn-crimson" style="flex:1;" onclick="endSpeech()">結束發言</button>
          </div>
        `;
      }
      else if (roomState.currentPhase === 'VOTING') {
        renderVotingPanel(p, controls);
      }
    }

    function renderNightPanel(p, container) {
      if (!p.isAlive) {
        container.innerHTML = `<p style="color:#888; font-size:0.8rem;">您已出局，請靜觀局勢...</p>`;
        return;
      }

      if (p.role === '預言家') {
        let html = `<p style="font-size:0.8rem; color:var(--gold-light);">🔮 選擇今晚查驗目標：</p><div class="target-grid">`;
        roomState.players.forEach(t => {
          if (t.isAlive && t.id !== p.id) {
            html += `<button class="target-btn" onclick="seerCheck(${t.id})">${t.id}號</button>`;
          }
        });
        html += `</div><div id="seerResult" style="margin-top:10px; font-weight:bold;"></div>`;
        container.innerHTML = html;
      }
      else if (p.role === '女巫') {
        container.innerHTML = `
          <p style="font-size:0.8rem;">🧪 昨晚倒下的是：<b style="color:var(--crimson-bright);">${roomState.nightVictim ? roomState.nightVictim + '號' : '無人死亡'}</b></p>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="btn-gothic" ${roomState.witchElixirUsed ? 'disabled' : ''} onclick="useWitchElixir()">${roomState.witchElixirUsed ? '解藥(已用)' : '解藥救人'}</button>
            <button class="btn-gothic btn-crimson" ${roomState.witchPoisonUsed ? 'disabled' : ''} onclick="useWitchPoison()">${roomState.witchPoisonUsed ? '毒藥(已用)' : '毒藥毒人'}</button>
          </div>
        `;
      }
      else if (p.role === '守衛') {
        let html = `<p style="font-size:0.8rem;">🛡️ 選擇守護目標 (不可連守)：</p><div class="target-grid">`;
        roomState.players.forEach(t => {
          if (t.isAlive) {
            const isDisabled = t.id === roomState.guardLastTarget;
            html += `<button class="target-btn" ${isDisabled ? 'disabled' : ''} onclick="guardProtect(${t.id})">${t.id}號${isDisabled?'<br>(昨守)':''}</button>`;
          }
        });
        html += `</div>`;
        container.innerHTML = html;
      }
      else if (p.role.includes('狼')) {
        let html = `<p style="font-size:0.8rem; color:var(--crimson-bright);">🐺 狼隊討論夜刀標靶：</p><div class="target-grid">`;
        roomState.players.forEach(t => {
          if (t.isAlive) {
            html += `<button class="target-btn" onclick="wolfKillTarget(${t.id})">${t.id}號</button>`;
          }
        });
        html += `</div>`;
        container.innerHTML = html;
      }
      else {
        container.innerHTML = `<p style="font-size:0.85rem; color:#aaa; text-align:center; padding:15px 0;">🌙 天黑請閉眼，請靜候天亮...</p>`;
      }
    }

    function seerCheck(targetId) {
      const target = roomState.players.find(x => x.id === targetId);
      const isWolf = target.role.includes('狼');
      document.getElementById('seerResult').innerHTML = `
        查驗結果：${targetId}號 是 <span style="color:${isWolf ? 'var(--crimson-bright)' : 'var(--gold-primary)'};">${isWolf ? '🐺 狼人陣營 (查殺)' : '💧 好人陣營 (金水)'}</span>
      `;
    }

    function useWitchElixir() {
      roomState.witchElixirUsed = true;
      alert("已使用解藥");
      updateControlPanel();
    }

    function useWitchPoison() {
      const t = prompt("請輸入要毒殺的玩家號碼:");
      if (t) {
        roomState.witchPoisonUsed = true;
        alert(`已使用毒藥毒殺 ${t} 號`);
        updateControlPanel();
      }
    }

    function guardProtect(targetId) {
      roomState.guardLastTarget = targetId;
      alert(`今晚護衛 ${targetId} 號`);
      updateControlPanel();
    }

    function wolfKillTarget(targetId) {
      roomState.nightVictim = targetId;
      alert(`狼隊選擇襲擊 ${targetId} 號`);
    }

    function renderVotingPanel(p, container) {
      if (!p.isAlive) {
        container.innerHTML = `<p style="color:#888; font-size:0.8rem;">您已出局，無投票權。</p>`;
        return;
      }

      let html = `<p style="font-size:0.8rem;">⚖️ 選擇公投處決目標：</p><div class="target-grid">`;
      roomState.players.forEach(t => {
        if (t.isAlive) {
          html += `<button class="target-btn" id="voteBtn-${t.id}" onclick="selectVoteTarget(${t.id})">${t.id}號</button>`;
        }
      });
      html += `</div>
        <button class="target-btn" style="width:100%; margin-top:8px;" onclick="selectVoteTarget(0)">棄票</button>
        <button class="btn-gothic btn-crimson" style="width:100%; margin-top:10px;" onclick="confirmVote()">✅ 確認投票</button>
      `;
      container.innerHTML = html;
    }

    let currentVoteTarget = null;
    function selectVoteTarget(id) {
      currentVoteTarget = id;
      document.querySelectorAll('.target-btn').forEach(b => b.classList.remove('selected'));
      if (id !== 0) {
        const btn = document.getElementById(`voteBtn-${id}`);
        if (btn) btn.classList.add('selected');
      }
    }

    function confirmVote() {
      if (currentVoteTarget === null) { alert("請先選擇目標！"); return; }
      alert(currentVoteTarget === 0 ? "已確認棄票" : `已確認投票處決 ${currentVoteTarget} 號`);
    }

    // 遊戲流程與 30 秒警長倒數
    function startGameFlow() {
      roomState.currentPhase = 'NIGHT';
      updateBanner("🌙 天黑請閉眼，請各神職與狼人進行夜間技能操作...");
      updateControlPanel();
      
      setTimeout(() => {
        roomState.currentPhase = 'SHERIFF_ELECTION';
        startSheriffCountdown();
        updateControlPanel();
      }, 8000);
    }

    function startSheriffCountdown() {
      roomState.sheriffTimer = 30;
      updateBanner(`🌅 警長競選中 (倒數 ${roomState.sheriffTimer}s)，請點擊『競選警長』舉手...`);
      clearInterval(roomState.timerInterval);
      
      roomState.timerInterval = setInterval(() => {
        roomState.sheriffTimer--;
        const el = document.getElementById('sheriffTimerSec');
        if (el) el.innerText = roomState.sheriffTimer;
        
        if (roomState.sheriffTimer <= 0) {
          clearInterval(roomState.timerInterval);
          advanceFromSheriffElection();
        }
      }, 1000);
    }

    function candidateSheriff(id) {
      const card = document.getElementById(`seat-${id}`);
      if (card) card.classList.add('highlight');
      roomState.players.find(x => x.id === id).isSheriff = true;
      alert(`${id}號玩家已參與警長競選！`);
    }

    function advanceFromSheriffElection() {
      alert("警長競選時間到！已自動選出警長，進入白天發言階段。");
      renderTable();
      roomState.currentPhase = 'DAY_SPEECH';
      updateBanner("☀️ 天亮了，請警長指定發言順序，或直接開始發言倒數...");
      startSpeechTimer();
      updateControlPanel();
    }

    function setSpeechOrder(dir) {
      updateBanner(`👑 警長指定發言順序：【${dir}】。進入 60 秒計時發言...`);
    }

    function startSpeechTimer() {
      roomState.speechTimer = 60;
      clearInterval(roomState.timerInterval);
      roomState.timerInterval = setInterval(() => {
        roomState.speechTimer--;
        const el = document.getElementById('timerSec');
        if (el) el.innerText = roomState.speechTimer;
        if (roomState.speechTimer <= 0) {
          clearInterval(roomState.timerInterval);
          alert("發言時間到！");
        }
      }, 1000);
    }

    function addSpeechTime() {
      roomState.speechTimer += 60;
      const el = document.getElementById('timerSec');
      if (el) el.innerText = roomState.speechTimer;
    }

    function endSpeech() {
      clearInterval(roomState.timerInterval);
      roomState.currentPhase = 'VOTING';
      updateBanner("⚖️ 進入公投處決階段，請選擇目標並點擊『確認投票』...");
      updateControlPanel();
    }

    function updateBanner(text) {
      document.getElementById('systemBanner').innerText = text;
    }

    function toggleFloatingPanel() {
      const panel = document.getElementById('floatingPanel');
      panel.classList.toggle('collapsed');
      document.getElementById('panelToggleIcon').innerText = panel.classList.contains('collapsed') ? '▲' : '▼';
    }

    function openSettings() {
      if (!roomState.isHost) { alert("只有房主可以更改規則！"); return; }
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function openCompendium() {
      document.getElementById('compendiumModal').style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function buildCompendium() {
      const list = document.getElementById('compendiumList');
      list.innerHTML = '';
      ROLES.forEach(r => {
        list.innerHTML += `
          <div class="compendium-item">
            <div class="compendium-name">${r.name} <span style="font-size:0.75rem; color:var(--gold-primary);">[${r.camp}]</span></div>
            <div class="compendium-desc">${r.desc}</div>
          </div>
        `;
      });
    }

    function applySettingsAndStart() {
      const count = parseInt(document.getElementById('playerCountSelect').value);
      roomState.sheriffMode = document.getElementById('sheriffModeSelect').value;
      closeModal('settingsModal');
      initPlayers(count);
      alert(`已將房間設置為 ${count} 人局！`);
    }
  </script>
</body>
</html>
