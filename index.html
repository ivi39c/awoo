<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gothic Crimson & Gold - 哥德暗黑狼人殺視訊平台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. 遊戲大廳（覆蓋層，選擇人數與初始化） -->
  <div id="lobbyOverlay" class="screen-overlay">
    <div class="lobby-card">
      <h1 class="lobby-title">領主的神聖試煉</h1>
      <p class="lobby-subtitle">Gothic Crimson & Gold Werewolf Engine</p>
      
      <div class="setup-group">
        <label for="playerCount">設定遊戲人數 (6-20人)：</label>
        <input type="number" id="playerCount" class="input-gothic" min="6" max="20" value="12">
      </div>

      <div class="setup-group">
        <label for="boardSelect">選擇聖典板型：</label>
        <select id="boardSelect" class="select-gothic">
          <option value="AUTO">萬能公式自動平衡</option>
          <option value="9_STANDARD">9人 經典標準局 (3狼/3神/3民)</option>
          <option value="12_STANDARD" selected>12人 國際標準預女獵守 (4狼/4神/4民)</option>
          <option value="13_AMOROUS">13人 暗戀者局</option>
          <option value="15_CUPID">15人 經典邱比特局</option>
          <option value="18_THIEF">18人 盜賊盲牌局</option>
        </select>
      </div>

      <button id="startGameBtn" class="btn-gothic btn-crimson" style="width: 100%; margin-top: 15px;">開啟黑暗儀式</button>
    </div>
  </div>

  <!-- 2. 頂部儀式狀態欄 -->
  <header>
    <div class="brand-title">🦇 哥德暗黑狼人殺視訊平台</div>
    <div class="top-actions">
      <div id="phaseIndicator" class="phase-badge">等待儀式開始...</div>
      <button id="nextPhaseBtn" class="btn-gothic">推進階段 ➔</button>
    </div>
  </header>

  <!-- 3. 系統公告橫幅 -->
  <div class="system-banner-box">
    <div id="bannerLine1" class="banner-line-1">DAY 0 - NIGHT</div>
    <div id="bannerLine2" class="banner-line-2">「天黑請閉眼，夜幕降臨...」</div>
    <div id="bannerLine3" class="banner-line-3">請上帝點擊右下角面板開始引導角色行動</div>
  </div>

  <!-- 4. 主戰場：視訊座位網格 -->
  <main class="main-layout">
    <div id="tableContainer" class="table-container">
      <!-- 由 game.js 根據人數動態渲染 seat-card -->
    </div>
  </main>

  <!-- 5. 右下角：上帝動態行動與結算面板 -->
  <div id="godPanel" class="floating-panel">
    <div class="panel-header" id="panelHeader">
      <span class="panel-title">🔮 上帝掌控法令 (行動面板)</span>
      <span id="toggleIcon">▲</span>
    </div>
    <div class="panel-body">
      <div id="godActionPrompt" class="action-prompt">請先開啟黑暗儀式。</div>
      
      <!-- 動態目標選擇按鈕區 -->
      <div id="targetGrid" class="target-grid"></div>

      <div class="panel-actions" style="margin-top: 15px; display: flex; gap: 10px;">
        <button id="submitActionBtn" class="btn-gothic btn-crimson" style="flex: 1;" disabled>確認夜間行動</button>
        <button id="skipActionBtn" class="btn-gothic" style="flex: 1;">跳過此角色</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
